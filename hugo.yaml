baseURL: "https://arstrof.eu"
languageCode: "en-us"
title: "Arsenii Trofimov"
theme: hugo-profile

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main: []

params:
  title: "Arsenii Trofimov"
  description: "Aerospace Engineering student at TU Delft, passionate about drones and autonomous systems."
  favicon: "/fav.png"
  useBootstrapCDN: false
  animate: true

  theme:
    defaultTheme: "dark"

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    brandName: "arstrof"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: true
      disableContact: false

  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Arsenii Trofimov."
    subtitle: "I build things that fly."
    content: "Aerospace Engineering student at TU Delft, fascinated by drones, autonomous systems, and everything that leaves the ground."
    image: /images/drone.svg
    bottomImage:
      enable: true
    button:
      enable: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/arstrof

  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I'm an Aerospace Engineering student at TU Delft with a deep interest in drones and autonomous flight systems. I enjoy working on projects that sit at the intersection of hardware, software, and the physics of flight.

      When I'm not studying, I'm tinkering with drone builds, exploring embedded systems, and learning about flight control.
    skills:
      enable: true
      title: "Things I work with:"
      items:
        - "C++"
        - "Python"
        - "HTML / JS"
        - "LaTeX"
        - "Git"
        - "CATIA / 3DEXPERIENCE"
        - "SOLIDWORKS"
        - "ArduPilot"
        - "Betaflight"
        - "Klipper"
        - "Soldering"

  education:
    enable: true
    index: false
    items:
      - title: "BSc Aerospace Engineering"
        school:
          name: "Delft University of Technology (TU Delft)"
          url: "https://www.tudelft.nl"
        date: "2025 - present"
        content: |-
          Studying aerodynamics, flight mechanics, structures, and control systems.

  experience:
    enable: true
    title: "Experience"
    items:
      - job: "Engineer"
        company: "DDI"
        date: "April 2026 – Present"
        info:
          enable: true
          content: "Part-time"
        featuredLink:
          enable: false
        content: |-
          Working at a drone company assembling UAVs, planning and executing test flights, and tuning firmware. Involved across the full development cycle — from hardware assembly and electronics to field operations and flight testing.

  achievements:
    enable: false

  projects:
    enable: true
    title: "Projects"
    items:
      - title: "Caladrius Mk2"
        content: "Team project to build a VTOL fixed-wing aircraft with three tilting propellers and a 1.2m wingspan. 3D-printed airframe with carbon fiber spars, targeting ArduPlane QuadPlane on a Matek F405-WING V2 for autonomous hover-to-forward-flight transition. My responsibilities: manufacturing and electronics integration."
        image: /images/projects/caladrius.jpg
        badges:
          - "ArduPilot"
          - "CAD"
          - "3D Printing"
          - "Electronics"

      - title: "Homemade Rocket"
        content: "Personal project: a fully 3D-printed rocket with homemade solid propellant. Designed and printed the airframe, then formulated and cast the fuel myself. An exercise in propulsion chemistry, structural design under thrust loads, and making something fly that really shouldn't exist."
        image: /images/projects/rocket.jpg
        badges:
          - "Rocketry"
          - "Propulsion"
          - "3D Printing"

      - title: "Maximum Payload RC Aircraft"
        content: "Team competition to design and build a fixed-wing aircraft maximising salt payload under strict constraints: no carbon fibre parts, and a protective case required to survive a 7-metre drop onto concrete. Balancing structural weight penalties against payload capacity within the ruleset."
        image: /images/projects/rc-team.jpg
        badges:
          - "Aerodynamics"
          - "Structures"
          - "Team Project"

      - title: "Custom 3D Printer"
        content: "Built a 3D printer from scratch running Klipper firmware. Tuned motion system, extruder calibration, and thermal management. The printer now produces parts for other projects including Caladrius."
        image: /images/projects/printer.jpg
        badges:
          - "Klipper"
          - "Mechanical"
          - "Electronics"

  contact:
    enable: true
    content: "Feel free to reach out — always happy to talk drones, aerospace, or interesting projects."
    btnName: "Email me"
    btnLink: "mailto:arsenii.trofimov2006@gmail.com"

  footer:
    recentPosts:
      enable: false
    socialNetworks:
      github: https://github.com/arstrof

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

